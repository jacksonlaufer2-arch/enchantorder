# Temporary: prints the Minecraft 26.2 API into the log so the mod can be written against it.
name: api-dump
on: [push]

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-configuration-cache compileClientJava
      - run: ./gradlew --no-configuration-cache genSources
        continue-on-error: true
      - run: bash .github/apidump/dump.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dump
          path: dump/
  show:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dump
          path: dump
      - run: cat dump/part${{ matrix.part }}.txt
